name: Auto Delete Played Scenes
description: Löscht automatisch Szenen, die 2 Mal oder öfter abgespielt wurden.
version: "1.0"
url: https://docs.stashapp.cc/
exec:
  - python
  - "{pluginDir}/auto_delete_played.py"
interface: raw
tasks:
  - name: "Played Scenes bereinigen"
    description: "Entfernt Szenen mit Play-Count >= 2 komplett (DB, Video-Datei, Metatags und Thumbnails)."
